name: CI/CD Backend Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/backend
          file: ./backend/backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  deploy:
    name: Deploy to Azure VM
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          script: |
            set -e # Exit immediately if a command fails

            # 1. Locate and enter the project directory
            if [ -d "$HOME/mocksewa" ]; then
              cd "$HOME/mocksewa"
            elif [ -d "$HOME/mock-sewa-backend" ]; then
              cd "$HOME/mock-sewa-backend"
            else
              echo "Directory not found, cloning repository..."
              git clone https://github.com/${{ github.repository }}.git "$HOME/mocksewa"
              cd "$HOME/mocksewa"
            fi

            echo "Current Directory: $(pwd)"
            git pull origin main

            # 2. Enter the backend folder where docker-compose resides
            cd backend
            echo "Moving to backend directory: $(pwd)"

            # 3. Inject Environment Variables (Multiple locations for safety)
            # Create in ./backend/.env
            echo "${{ secrets.BACKEND_ENV }}" > .env
            # Create in ./backend/backend/.env (which matches docker-compose.yml path)
            mkdir -p backend
            echo "${{ secrets.BACKEND_ENV }}" > backend/.env

            echo "Listing files to verify .env path:"
            ls -R | grep .env || echo "No .env found!"

            # 4. Authenticate with GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 5. Pull and Update
            echo "Pulling latest images..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull backend

            echo "Starting containers..."
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

            # 6. Run Migrations (Safe Check)
            echo "Waiting for backend to start..."
            sleep 15
            CONTAINER_ID=$(docker ps -qf "name=mocksewa-backend")
            if [ -n "$CONTAINER_ID" ]; then
              echo "Container found ($CONTAINER_ID), running migrations..."
              docker exec $CONTAINER_ID npx sequelize-cli db:migrate
            else
              echo "Error: Backend container failed to stay up. Checking logs..."
              docker compose logs backend
              exit 1
            fi

            # 7. Cleanup
            docker image prune -f
