name: CI/CD Backend Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/backend
          file: ./backend/backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  deploy:
    name: Deploy to Azure VM
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          script: |
            # 1. Locate the project directory or clone it
            if [ -d "$HOME/mocksewa" ]; then
              cd "$HOME/mocksewa"
            elif [ -d "$HOME/mock-sewa-backend" ]; then
              cd "$HOME/mock-sewa-backend"
            else
              echo "Directory not found, cloning repository..."
              git clone https://github.com/${{ github.repository }}.git "$HOME/mocksewa"
              cd "$HOME/mocksewa"
            fi

            # 2. Sync orchestrator files
            git pull origin main
            cd backend

            # 3. Inject Environment Variables
            # We create it in both places to satisfy both the base and prod compose files
            echo "${{ secrets.BACKEND_ENV }}" > .env
            mkdir -p backend
            echo "${{ secrets.BACKEND_ENV }}" > backend/.env

            # 4. Authenticate with GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 5. Pull and Update
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull backend
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

            # 6. Run Migrations (Safe Check)
            echo "Waiting for backend to start..."
            sleep 10
            CONTAINER_ID=$(docker ps -qf "name=mocksewa-backend")
            if [ -n "$CONTAINER_ID" ]; then
              echo "Container found ($CONTAINER_ID), running migrations..."
              docker exec $CONTAINER_ID npx sequelize-cli db:migrate
            else
              echo "Error: Backend container not found. Check logs with 'docker compose logs'."
              exit 1
            fi

            # 7. Cleanup
            docker image prune -f
